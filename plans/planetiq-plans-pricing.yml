description: >-
  PlanetiQ publishes no pricing page, no plan tiers, and no self-service purchase
  path. https://planetiq.com/pricing/ and https://planetiq.com/plans/ both return
  HTTP 404, and the products page (https://planetiq.com/products/) closes on a
  "Contact Us" call to action rather than a price. Revenue is contract-based: NOAA
  Commercial Data Program radio occultation data buys (RODB-2 IDIQ delivery
  orders), NASA Commercial Satellite Data Acquisition on-ramps, and a U.S. Air
  Force STRATFI agreement, each announced by press release with a contract value
  rather than a published rate card. This is a recorded absence, not an
  un-researched gap.
