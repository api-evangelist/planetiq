  PlanetiQ publishes a real llms.txt on its apex host and it is a genuine, dated
  document (last_updated 2026-05-27), not a placeholder. Saved verbatim; not
  generated by API Evangelist. Its shape is unusual: rather than the conventional
  markdown "# Title / > summary / ## Section / - [link](url)" form, it is written
  as TOML-style sections ([project], [company], [keywords], [products],
  [industries_served], [data], [important_pages], [ai_guidance], [contact],
  [crawler_policy], [last_updated]). An agent parsing strict llms.txt markdown will
  get nothing useful out of it; an agent reading it as prose or TOML will. It is a
  marketing/positioning document — it names no API, no base URL, no endpoint and no
  developer documentation, which is consistent with the rest of this profile.
