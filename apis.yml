aid: planetiq
name: PlanetiQ
description: 'PlanetiQ is a commercial space-weather and atmospheric data company headquartered in
  Golden, Colorado, operating the GNOMES constellation of small satellites carrying its Pyxis GNSS
  radio occultation (GNSS-RO) sensor. Pyxis receives signals from all four global navigation
  constellations (GPS, GLONASS, Galileo and BeiDou) and turns the refracted signal into vertical
  atmospheric profiles of temperature, pressure, density, refractivity and humidity at 100 m vertical
  resolution, plus ionospheric total electron content, scintillation phase and polarimetric
  precipitation observations. The data is sold as Level 1B calibrated phase/SNR and Level 2 bending
  angle/refractivity products, primarily under U.S. government contracts (NOAA Commercial Data Program
  radio occultation data buys, NASA Commercial Satellite Data Acquisition, U.S. Air Force STRATFI) and
  redistributed to authorized users in netCDF via NASA''s Satellite Data Explorer. PlanetiQ publishes no
  public developer program, no API, and no machine-readable API contract; commercial and defense access
  runs through a sales conversation rather than self-service onboarding.'
